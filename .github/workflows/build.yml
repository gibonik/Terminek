name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Xcode
        run: |
          # Najnowszy stabilny Xcode 26+ (Liquid Glass), a gdy go nie ma, 16.4.
          X=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          [ -n "$X" ] || X=/Applications/Xcode_16.4.app
          echo "Wybrany: $X"
          sudo xcode-select -s "$X" || true
          xcodebuild -version

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen

      - name: Tests (simulator)
        run: |
          DEST=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          set +e
          xcodebuild test -project Terminy.xcodeproj -scheme Terminy \
            -destination "id=$DEST" -resultBundlePath build/Tests.xcresult \
            CODE_SIGNING_ALLOWED=NO > test.log 2>&1
          status=$?
          grep -E "error:|Test Case|Executed|\*\* TEST" test.log
          if [ $status -ne 0 ]; then
            echo "::group::Crash reports"
            find ~/Library/Logs/DiagnosticReports -name 'Terminy*' -newer test.log -o -name 'Terminy*' -mmin -15 2>/dev/null | head -3 | while read f; do echo "== $f"; head -c 6000 "$f"; done
            echo "::endgroup::"
            tail -n 60 test.log
          fi
          exit $status

      - name: Smoke test (app starts and stays up)
        run: |
          DEST=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          xcrun simctl boot "$DEST" || true
          APP=$(find ~/Library/Developer/Xcode/DerivedData -path '*Debug-iphonesimulator/Terminy.app' -maxdepth 6 | head -1)
          xcrun simctl install "$DEST" "$APP"
          xcrun simctl launch "$DEST" pl.terminy.app
          sleep 8
          xcrun simctl spawn "$DEST" launchctl list | grep -q "pl.terminy.app" || { echo "::error::Aplikacja padła po starcie"; find ~/Library/Logs/DiagnosticReports -name 'Terminy*' -mmin -5 | head -1 | xargs -I{} head -c 6000 {}; exit 1; }
          echo "Aplikacja działa po 8 s"

      - name: Screenshots (demo data)
        continue-on-error: true
        run: |
          DEST=$(xcrun simctl list devices booted -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for v in d.values() for x in v))")
          mkdir -p build/shots
          xcrun simctl status_bar "$DEST" override --time 9:41 --batteryLevel 100 --cellularBars 4 || true
          for look in light dark; do
            xcrun simctl ui "$DEST" appearance $look
            for tab in home detail add calendar settings; do
              xcrun simctl terminate "$DEST" pl.terminy.app || true
              xcrun simctl launch "$DEST" pl.terminy.app -demoData -startTab $tab
              sleep 5
              xcrun simctl io "$DEST" screenshot "build/shots/$look-$tab.png"
            done
          done
          xcrun simctl ui "$DEST" appearance light
          ls -la build/shots

      - name: Diagnostic - CloudKit path without entitlement
        continue-on-error: true
        run: |
          DEST=$(xcrun simctl list devices booted -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for v in d.values() for x in v))")
          xcrun simctl terminate "$DEST" pl.terminy.app || true
          xcrun simctl launch "$DEST" pl.terminy.app -forceCloudKit
          sleep 8
          if xcrun simctl spawn "$DEST" launchctl list | grep -q "pl.terminy.app"; then echo "CloudKit bez uprawnień: NIE crashuje"; else echo "CloudKit bez uprawnień: CRASH"; find ~/Library/Logs/DiagnosticReports -name 'Terminy*' -mmin -3 | head -1 | xargs -I{} head -c 4000 {}; fi

      - name: Build unsigned .ipa (for Sideloadly / AltStore)
        run: |
          set -o pipefail
          xcodebuild archive -project Terminy.xcodeproj -scheme Terminy \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/Terminy.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -n 30
          mkdir -p build/Payload
          cp -R build/Terminy.xcarchive/Products/Applications/Terminy.app build/Payload/
          (cd build && zip -qr Terminy.ipa Payload)

      - uses: actions/upload-artifact@v4
        with:
          name: Terminy-ipa
          path: build/Terminy.ipa
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: build/shots
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: logs
          path: |
            test.log
            build/Tests.xcresult
